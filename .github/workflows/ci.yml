name: AI Test Generation & Coverage

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main, test ]
  issues:
    types: [opened, reopened]  # Trigger on new issues or reopened issues

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc lcov

    - name: Install Python dependencies
      run: |
        pip install google-generativeai

    - name: Clone universal-c-testgen tool
      run: |
        git clone -b test https://github.com/SwathantraPulicherla/universal-c-testgen.git ../universal-c-testgen

    - name: Set up Unity testing framework
      run: |
        if [ ! -d "unity" ]; then
          git clone https://github.com/ThrowTheSwitch/Unity.git unity
        fi

    - name: Clean build directory
      run: |
        rm -rf build/
        rm -rf tests/generated/

    - name: Validate source code quality
      run: |
        python ../universal-c-testgen/src/scripts/validate_source_code.py src/

    - name: Generate and validate AI-powered tests with smart retry
      run: |
        echo "� Running AI test generation with cost-effective retry logic..."
        python ../universal-c-testgen/src/scripts/smart_retry.py . ../universal-c-testgen
        RETRY_EXIT_CODE=$?

        if [ $RETRY_EXIT_CODE -ne 0 ]; then
          echo "❌ AI test generation failed after smart retries"
          exit 1
        fi
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Validate generated tests compile
      run: |
        echo "🔍 Validating that all generated tests compile individually..."
        python ../universal-c-testgen/src/scripts/compile_validation.py tests/generated/
        COMPILE_EXIT_CODE=$?

        if [ $COMPILE_EXIT_CODE -ne 0 ]; then
          echo "❌ Some test files have compilation errors - cannot proceed with build"
          exit 1
        fi

    - name: Build and run tests
      run: |
        echo "🔨 Building test executables..."
        python ../universal-c-testgen/src/scripts/build_system.py . --run
        BUILD_EXIT_CODE=$?

        if [ $BUILD_EXIT_CODE -ne 0 ]; then
          echo "❌ Build or test execution failed"
          exit 1
        fi

    - name: Generate coverage report
      run: |
        echo "📊 Generating coverage report..."
        python ../universal-c-testgen/src/scripts/coverage_generator.py ./build ./src
        COVERAGE_EXIT_CODE=$?

        if [ $COVERAGE_EXIT_CODE -ne 0 ]; then
          echo "❌ Coverage generation failed"
          exit 1
        fi

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: coverage-report
        path: coverage-report/
        retention-days: 30

    - name: Create test summary
      if: always()
      run: |
        echo "## 🤖 AI-Powered Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ Test Generation" >> $GITHUB_STEP_SUMMARY
        echo "- AI-generated comprehensive unit tests" >> $GITHUB_STEP_SUMMARY
        echo "- Tests compiled successfully with coverage instrumentation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🧪 Test Execution" >> $GITHUB_STEP_SUMMARY
        echo "- All generated tests executed" >> $GITHUB_STEP_SUMMARY
        echo "- Unity testing framework integration" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "📈 **HTML Coverage Report Available**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Download:** Go to Actions → This workflow → Artifacts → coverage-report" >> $GITHUB_STEP_SUMMARY
        echo "**View Report:** Download and open \`coverage-report/index.html\` in your browser" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🎯 Key Features" >> $GITHUB_STEP_SUMMARY
        echo "- AI-generated test cases using Google Gemini" >> $GITHUB_STEP_SUMMARY
        echo "- Automatic dependency analysis" >> $GITHUB_STEP_SUMMARY
        echo "- CMake-based build system with coverage" >> $GITHUB_STEP_SUMMARY
        echo "- Interactive HTML coverage visualization" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "*Generated by Universal C TestGen - AI-powered testing for C projects*" >> $GITHUB_STEP_SUMMARY