name: AI Test Generation

on:
  push:
    branches: [ main, develop ]
  issues:
    types: [ labeled ]

jobs:
  generate-tests:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'issues' && github.event.label.name == 'ai-test-generate')

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-generativeai

    - name: Run AI test generation
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # Clone the test generator tool with authentication
        git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SwathantraPulicherla/testgen-tool.git ../testgen-tool

        # Run the test generation
        python ../testgen-tool/src/scripts/run_testgen.py . --api-key $GEMINI_API_KEY

    - name: Commit generated tests
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Check if there are changes to commit
        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git add tests/generated/
          git add unity/

          # Create commit message based on trigger
          if [ "${{ github.event_name }}" = "push" ]; then
            COMMIT_MSG="🤖 AI-generated unit tests (push to ${{ github.ref_name }})"
          else
            ISSUE_NUMBER="${{ github.event.issue.number }}"
            COMMIT_MSG="🤖 AI-generated unit tests (issue #$ISSUE_NUMBER)"
          fi

          git commit -m "$COMMIT_MSG" || echo "No changes to commit"
          git push
        fi

    - name: Comment on issue (if triggered by issue)
      if: github.event_name == 'issues'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🤖 **AI Test Generation Complete!**\n\nGenerated unit tests have been added to the `tests/generated/` directory.\n\n**What was generated:**\n- Unity framework test files for all C source files\n- Comprehensive test coverage including edge cases\n- Automatic stub generation for dependencies\n- Validation reports for test quality\n\n**Next steps:**\n1. Review the generated tests\n2. Run the test suite locally\n3. Fix any compilation issues if needed\n4. Integrate tests into your CI/CD pipeline'
          })